name: ACGS Enterprise Manager CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-test.txt

    - name: Lint with flake8
      run: |
        flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 backend --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check code formatting with black
      run: |
        black --check backend tests

    - name: Run unit tests
      run: |
        pytest tests/unit -v --cov=backend --cov-report=xml --cov-report=term-missing -m "unit"

    - name: Run governance tests
      run: |
        pytest tests/governance -v --cov=backend --cov-append --cov-report=xml -m "governance"

    - name: Run integration tests
      run: |
        pytest tests/integration -v --cov=backend --cov-append --cov-report=xml -m "integration"

    - name: Check coverage threshold
      run: |
        # Interim floor: measured 44.76% on 2026-10-27. Raise as coverage grows; target 80.
        coverage report --fail-under=44
