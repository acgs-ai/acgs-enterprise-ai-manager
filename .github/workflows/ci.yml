name: ACGS Enterprise Manager CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt

    - name: Lint with flake8
      run: |
        flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 backend --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check code formatting with black
      run: |
        black --check backend tests

    - name: Run unit tests
      run: |
        pytest tests/unit -v --cov=backend --cov-report=xml --cov-report=term-missing -m "unit"

    - name: Run governance tests
      run: |
        pytest tests/governance -v --cov=backend --cov-append --cov-report=xml -m "governance"

    - name: Run integration tests
      run: |
        pytest tests/integration -v --cov=backend --cov-append --cov-report=xml -m "integration"

    - name: Check coverage threshold
      run: |
        coverage report --fail-under=80
